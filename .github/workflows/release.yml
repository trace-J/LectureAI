# Build Syllabus.app and its disk image, and publish them as a GitHub Release.
#
# Pushing a tag vX.Y.Z that matches intake.__version__ builds the app on an
# Apple silicon runner, wraps it in Syllabus-X.Y.Z.dmg, and creates the
# release with the image and its checksum attached. The app's update notice
# (intake/updates.py) reads that list. A manual run, or a push touching the
# packaging, builds everything and keeps the image as a workflow artifact
# without publishing, so the recipe can be checked first.
#
# Signing: when the SYLLABUS_CODESIGN_IDENTITY variable and the certificate
# secrets exist the build is signed and notarized; until then the image is
# signed ad hoc and the release notes carry the Gatekeeper steps.
#
# Nothing is published until the suites pass. The `tests` job below is the
# same set CI runs on a pull request, repeated here because a tag can point at
# any commit, including one that never went through a PR, and the app's update
# notice sends people straight to whatever this publishes.
name: Release Syllabus.app

on:
  push:
    tags: ["v*"]
    paths-ignore: []
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A gate, not a duplicate of CI: this runs on the macOS runner the app is
  # actually built on, and it is what `build` waits for. macOS ships lsof at
  # /usr/sbin/lsof, but the runner image does not ship ffmpeg, so the step
  # below fetches it.
  tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `transcribe.duration_seconds` shells out to ffprobe, which the runner
      # image does not carry: on 2026-09-19 that failed three assertions across
      # test_gui and test_record and held back the 0.3.0 release, while the same
      # suites passed on a Mac. Take the build the .app itself bundles, pinned
      # and checksummed in packaging/ffmpeg/release, rather than brew: it is the
      # binary users actually get, so the gate cannot pass against a different
      # ffmpeg than the one it is guarding.
      - name: ffmpeg and ffprobe, the build the app bundles
        run: |
          set -euo pipefail
          eval "$(sed 's/^/PIN_/' packaging/ffmpeg/release)"
          DIR="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$DIR"
          curl -sfL -o "$DIR/$PIN_asset" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$PIN_tag/$PIN_asset"
          echo "$PIN_sha256  $DIR/$PIN_asset" | shasum -a 256 -c -
          tar -xzf "$DIR/$PIN_asset" -C "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/ffprobe" -version | head -1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Tests
        run: |
          set -uo pipefail
          failed=()
          for suite in test_*.py; do
            python "$suite" || failed+=("$suite")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::not publishing: ${#failed[@]} suite(s) failed: ${failed[*]}"
            exit 1
          fi

  build:
    needs: tests
    runs-on: macos-15  # Apple silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package with the app and build extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[app,build]'

      - name: The tag must be the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import intake; print(intake.__version__)')"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "tag $TAG does not match intake.__version__ $VERSION; bump intake/__init__.py first" >&2
            exit 1
          fi

      - name: Build Syllabus.app
        env:
          PYTHON: python
        run: packaging/build.sh

      - name: Build the disk image
        id: dmg
        run: |
          set -euo pipefail
          packaging/dmg.sh dist/Syllabus.app dist
          DMG="$(ls dist/Syllabus-*.dmg)"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Keep the result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.dmg }}.sha256
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            sed "s/{{version}}/$VERSION/g; s/{{dmg}}/$(basename "$DMG")/g" packaging/release-notes.md
            echo
            echo "sha256: $(cut -d' ' -f1 "$DMG.sha256")"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "Syllabus $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
